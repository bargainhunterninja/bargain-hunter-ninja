<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form detection</title></head>
  <body>
    <form name="seller-offer" method="POST" enctype="multipart/form-data" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="seller-offer">
      <input type="text" name="asking-price">
      <select name="sale-size"><option value="One item">One item</option><option value="A few items">A few items</option><option value="Whole collection or bulk lot">Whole collection or bulk lot</option></select>
      <input name="bot-field"><input name="name"><input name="phone" type="tel"><input name="email" type="email"><input name="item"><textarea name="details"></textarea><input name="photo-1" type="file"><input name="photo-2" type="file"><input name="photo-3" type="file">
    </form>
  </body>
</html>
